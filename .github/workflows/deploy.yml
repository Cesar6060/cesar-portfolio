# CD Pipeline - Deploys to Render on merge to master
# Run tests → trigger Render deploy hook → Render builds the Docker image from the repo

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn test

      # The hook URL is passed through the environment rather than interpolated
      # into the command line, so it never appears in the rendered shell command.
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -o /dev/null "$RENDER_DEPLOY_HOOK_URL"

      - name: Deployment notification
        run: |
          echo "Render deploy triggered"
          echo "Render builds the Docker image and swaps it in once healthy"
          echo "Check https://cesarvillarreal.dev in a few minutes"

# Required GitHub Secrets:
# ────────────────────────
# RENDER_DEPLOY_HOOK_URL - Deploy hook URL from Render dashboard
#                          (Service → Settings → Deploy Hook)
#
# Render auto-deploy is OFF — deploys only happen through this workflow,
# so nothing reaches production without tests passing first
